<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily timer — pill study</title>
<style>
:root {
  color-scheme: light;
  --foreground: #202020;
  --muted-foreground: #737373;
  --font-sans: Inter, "SF Pro Display", "Segoe UI Variable", system-ui, sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; font-family: var(--font-sans); color: var(--foreground); }
main { max-width: 560px; margin: 48px auto; }
.themes { display: grid; grid-template-columns: repeat(2, 248px); gap: 64px; }
h2 { font-size: 14px; font-weight: 500; margin: 0 0 30px; letter-spacing: -.02em; }
figure { margin: 0 0 30px; }
figcaption { margin: 0 0 10px 18px; color: var(--muted-foreground); font-size: 11px; line-height: 16px; }
.pill {
  --surface: #FCFCFC; --ink: #202020; --edge: #E3E3E3;
  --secondary-ink: #707070; --hover: #EFEFEF; --pressed: #E5E5E5;
  --red: #C84B46; --yellow: #B68719; --green: #31825B;
  display: flex; align-items: center; width: 248px; height: 48px;
  padding: 0 7px 0 18px; gap: 0;
  background: var(--surface); color: var(--ink);
  border: 1px solid var(--edge); border-radius: 999px;
  /* The empty space and time become the native drag region in the React port. */
  user-select: none;
}
.dark .pill {
  --surface: #202020; --ink: #F5F5F5; --edge: #363636;
  --secondary-ink: #A3A3A3; --hover: #303030; --pressed: #3A3A3A;
  --red: #EF7973; --yellow: #D6B34E; --green: #73B68F;
  color-scheme: dark;
}
.dot { width: 6px; height: 6px; flex-shrink: 0; border-radius: 50%; background: var(--red); margin-right: 12px; }
.pill[data-running="true"] .dot { background: var(--yellow); }
.pill[data-done="true"] .dot { background: var(--green); }
.time {
  font-size: 21px; font-weight: 500; line-height: 1;
  font-variant-numeric: tabular-nums; font-feature-settings: "tnum";
  letter-spacing: -.035em; white-space: nowrap; flex: 1;
}
button {
  appearance: none; display: grid; place-items: center; flex: 0 0 34px;
  width: 34px; height: 34px; padding: 0; margin: 0; border: 0;
  border-radius: 50%; background: transparent; color: inherit;
  cursor: pointer; transition: background-color 120ms ease, transform 120ms ease;
}
button:hover { background: var(--hover); }
button:active { background: var(--pressed); transform: scale(.94); }
button:focus-visible { outline: 1px solid currentColor; outline-offset: 1px; }
button svg { width: 16px; height: 16px; }
.settings { color: var(--secondary-ink); margin-left: 2px; }
.play-icon { transform: translateX(1px); }
.pause-icon { display: none; }
[data-running="true"] .play-icon { display: none; }
[data-running="true"] .pause-icon { display: block; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.note { margin: 6px 0 0; color: var(--muted-foreground); font-size: 11px; line-height: 1.7; max-width: 48ch; }
[popover] {
  font-family: var(--font-sans); font-size: 13px; line-height: 1.7;
  color: #202020; background: #FCFCFC; border: 1px solid #E3E3E3;
  border-radius: 12px; padding: 20px 24px; max-width: 280px;
}
[popover] p { margin: 0; }
[popover] small { color: #707070; }
@media (max-width: 600px) {
  main { width: 248px; margin: 32px auto; }
  .themes { grid-template-columns: 248px; gap: 20px; }
}
@media (prefers-reduced-motion: reduce) { button { transition: none; } }
</style>
</head>

<p class="note">Daily minimum: 3 hours. Try the play / pause controls.<br>Times are illustrative; green stays green once the goal is met.</p>
</main>
<div id="settings" popover>
<p>Daily minimum <strong>3 hours</strong></p>
<small>Settings preview. Click outside or press Esc to close.</small>
</div>
<script>
document.querySelectorAll(".toggle").forEach(button => {
  button.addEventListener("click", () => {
    const pill = button.closest(".pill");
    const running = pill.dataset.running !== "true";
    pill.dataset.running = String(running);
    button.setAttribute("aria-pressed", String(running));
    button.setAttribute("aria-label", running ? "Pause timer" : "Start timer");
    button.title = running ? "Pause timer" : "Start timer";
    pill.previousElementSibling.textContent =
      (running ? "Running" : "Paused") + " · " +
      (pill.dataset.done === "true" ? "goal met" : "goal not met");
  });
});
</script>
