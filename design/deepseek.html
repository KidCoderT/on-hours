<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hormozi Timer — pill mockup</title>
<style>
  :root{
    --font-sans:"Inter","SF Pro Display","Segoe UI Variable Text","Segoe UI Variable","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
    --page:#E9E8E4;
    --page-ink:#1B1B19;
    --page-muted:#8C8A82;
    --light-panel:#F5F4F1;
    --light-line:#E4E2DC;
    --dark-panel:#0E0E0F;
    --dark-line:#232325;
  }

  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    min-height:100vh;
    background:var(--page);
    color:var(--page-ink);
    font-family:var(--font-sans);
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    -webkit-tap-highlight-color:transparent;
    padding:64px 28px 80px;
    display:flex;
    justify-content:center;
  }
  .page{width:100%;max-width:712px}

  /* ---------- page masthead ---------- */

  .masthead{margin:0 0 34px 2px}
  .eyebrow{
    margin:0;font-size:10px;font-weight:600;letter-spacing:.18em;
    text-transform:uppercase;color:var(--page-muted);
  }
  .masthead h1{
    margin:10px 0 0;font-size:21px;font-weight:500;letter-spacing:-.012em;line-height:1.15;
  }
  .masthead p{
    margin:9px 0 0;max-width:48ch;font-size:12px;line-height:1.55;
    letter-spacing:.005em;color:var(--page-muted);
  }

  /* ---------- boards ---------- */

  .boards{display:grid;grid-template-columns:1fr 1fr;gap:20px}
  @media (max-width:680px){.boards{grid-template-columns:1fr}}

  .panel{
    border-radius:18px;border:1px solid;
    padding:28px 22px 30px;
    display:flex;flex-direction:column;align-items:center;gap:26px;
  }
  .panel--light{background:var(--light-panel);border-color:var(--light-line)}
  .panel--dark{background:var(--dark-panel);border-color:var(--dark-line)}

  .panel-head{width:100%;display:flex;align-items:center;gap:10px}
  .panel-head span{
    font-size:10px;font-weight:600;letter-spacing:.15em;text-transform:uppercase;
    color:#98958D;line-height:1;
  }
  .panel-head i{flex:1;height:1px;background:var(--light-line)}
  .panel--dark .panel-head span{color:#76746E}
  .panel--dark .panel-head i{background:var(--dark-line)}

  .case{margin:0;display:flex;flex-direction:column;align-items:center;gap:13px}
  .case figcaption{
    font-size:10px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;
    line-height:1;color:#8D8A82;
  }
  .panel--dark .case figcaption{color:#86847C}

  /* ---------- the pill ---------- */

  .pill{
    --dot:#C0453C;
    --ink:#161614;
    --icon:#4E4C46;
    --hover:#F1F0EB;
    --hair:#E7E5DF;
    --edge:#E8E6E1;

    position:relative;
    width:240px;height:48px;
    display:flex;align-items:center;
    padding:0 9px 0 17px;
    border:1px solid var(--edge);
    border-radius:999px;
    background:#fff;
    color:var(--ink);
    user-select:none;
    transition:border-color .18s ease, box-shadow .18s ease;
  }
  .pill--light{
    background:#fff;border-color:#E8E6E1;
    box-shadow:0 10px 22px -18px rgba(26,26,22,.55);
  }
  .pill--light:hover{
    border-color:#DDDAD3;
    box-shadow:0 12px 26px -18px rgba(26,26,22,.62);
  }
  .pill--dark{
    background:#1A1A1B;border-color:#2B2B2D;
    box-shadow:0 10px 22px -16px rgba(0,0,0,.9);
    --dot:#DA6055;
    --ink:#F4F3EF;
    --icon:#B8B5AC;
    --hover:#252526;
    --hair:#2C2C2E;
  }
  .pill--dark:hover{border-color:#363639}

  /* status dot — base colour is "paused, not done" */
  .pill[data-running="true"][data-done="false"]{--dot:#C6922A}
  .pill[data-done="true"]{--dot:#4B7A54}
  .pill--dark[data-running="true"][data-done="false"]{--dot:#D8AB45}
  .pill--dark[data-done="true"]{--dot:#63A575}

  .dot{
    position:relative;flex:none;
    width:6px;height:6px;border-radius:50%;
    background:var(--dot);margin-right:12px;
    transition:background-color .2s ease;
  }
  .dot::after{
    content:"";position:absolute;inset:-1px;border-radius:50%;
    border:1px solid var(--dot);
    opacity:0;transform:scale(1);
  }
  .pill[data-running="true"] .dot::after{
    animation:pulse 3s cubic-bezier(.22,.61,.28,1) infinite;
  }
  @keyframes pulse{
    0%  {opacity:.45;transform:scale(1)}
    55% {opacity:0;  transform:scale(3.1)}
    100%{opacity:0;  transform:scale(3.1)}
  }
  @media (prefers-reduced-motion:reduce){
    .pill[data-running="true"] .dot::after{animation:none}
  }

  /* time */
  .time{
    font-size:15px;font-weight:500;line-height:1;
    letter-spacing:.02em;
    font-variant-numeric:tabular-nums;
    font-feature-settings:"tnum" 1;
    color:var(--ink);
    transform:translateY(-.5px);
    white-space:nowrap;
  }
  .time i{font-style:normal;font-weight:400;opacity:.4;margin:0 .02em}

  .rule{
    margin-left:auto;margin-right:7px;
    width:1px;height:14px;background:var(--hair);
  }

  /* controls */
  .controls{display:flex;align-items:center}
  .icon-btn{
    appearance:none;border:0;background:transparent;padding:0;
    width:30px;height:30px;border-radius:50%;
    display:grid;place-items:center;
    color:var(--icon);cursor:pointer;
    transition:background-color .16s ease, color .16s ease, transform .12s ease;
  }
  .icon-btn:hover{background:var(--hover);color:var(--ink)}
  .icon-btn:active{transform:scale(.9)}
  .icon-btn:focus-visible{outline:1.5px solid var(--ink);outline-offset:1px}
  .icon-btn svg{display:block}

  .pill [data-icon="pause"]{display:none}
  .pill[data-running="true"] [data-icon="pause"]{display:block}
  .pill[data-running="true"] [data-icon="play"]{display:none}

  @keyframes iconIn{
    from{opacity:0;transform:scale(.86)}
    to  {opacity:1;transform:scale(1)}
  }
  .pill [data-icon]{animation:iconIn .16s ease both}

  /* ---------- demo ---------- */

  .demo{
    margin-top:20px;border-radius:18px;border:1px solid var(--light-line);
    background:var(--light-panel);
    padding:28px 22px 24px;
    display:flex;flex-direction:column;align-items:center;gap:20px;
  }
  .demo-actions{
    display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:14px;
    font-size:10px;letter-spacing:.11em;text-transform:uppercase;
  }
  .demo-goal{color:#918E86;font-weight:600}
  .dot-sep{color:#C4C1B9}
  .text-btn{
    appearance:none;border:0;background:none;padding:2px 0;
    font-family:inherit;font-size:10px;font-weight:600;
    letter-spacing:.11em;text-transform:uppercase;
    color:#8C8A82;cursor:pointer;
    transition:color .15s ease;
  }
  .text-btn:hover{color:#161614}
  .text-btn:focus-visible{outline:1.5px solid #161614;outline-offset:3px;border-radius:2px}

  .spec{
    margin:24px 0 0;text-align:center;
    font-size:10px;letter-spacing:.11em;text-transform:uppercase;
    color:#9A978F;
  }

  @media (max-width:680px){
    body{padding:44px 20px 60px}
    .masthead p{font-size:11.5px}
  }
</style>

<script>
(function () {
  var pill = document.getElementById('demo');
  var toggle = document.getElementById('demo-toggle');
  var goalBtn = document.getElementById('demo-goal');
  var resetBtn = document.getElementById('demo-reset');
  var hEl = pill.querySelector('[data-unit="h"]');
  var mEl = pill.querySelector('[data-unit="m"]');
  var sEl = pill.querySelector('[data-unit="s"]');

  var GOAL = 4 * 60 * 60;
  var START = 2 * 60 * 60 + 14 * 60 + 7;
  var elapsed = START;
  var running = false;

  function pad(n) { return n < 10 ? '0' + n : String(n); }

  function render() {
    var done = elapsed >= GOAL;
    hEl.textContent = Math.floor(elapsed / 3600);
    mEl.textContent = pad(Math.floor((elapsed % 3600) / 60));
    sEl.textContent = pad(elapsed % 60);
    pill.dataset.running = String(running);
    pill.dataset.done = String(done);
    toggle.setAttribute('aria-pressed', String(running));
    toggle.setAttribute('aria-label', running ? 'Pause' : 'Start');
  }

  toggle.addEventListener('click', function () {
    running = !running;
    render();
  });

  goalBtn.addEventListener('click', function () {
    elapsed = GOAL + 2 * 60 + 31;
    render();
  });

  resetBtn.addEventListener('click', function () {
    elapsed = START;
    running = false;
    render();
  });

  setInterval(function () {
    if (running) {
      elapsed += 1;
      render();
    }
  }, 1000);

  render();
})();
</script>
